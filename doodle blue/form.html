<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Form Controls</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>HTML Form Controls</h1>
        <form action="/preferences" method="post">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" minlength="2" maxlength="60" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required><br><br>

            <label for="phone">phone number</label>
            <input type="number" id="phone" name="phone" pattern="[0-9]{10}" required><br><br>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="course">Preferred Course:</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="Computer Science">HTML &amp; CSS</option>
                <option value="Mechanical Engineering">Java Script</option>
                <option value="Electrical Engineering">Frontend Development</option>
            </select><br><br>
            <label for="bio">About You</label><br>
            <textarea id="bio" name="bio" rows="4" maxlength="300"
                placeholder="Tell us about yourself"></textarea><br><br>
            <button type="submit">Save Preferences</button>
            <br><br>
            <label for="resume">Resume (PDF)</label>
            <input type="file" id="resume" name="resume" accept=".pdf,applicaton/pdf">
            <br><br>
            <fieldset>
                <legend>Terms and Conditions</legend>
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the terms and conditions
                </label>
            </fieldset>

            </label><br><br>
            </fieldset>
            <fieldset>
                <legend>Select your Skills </legend>
                <label for="skill-html">
                    <input type="checkbox" id="skill-html" name="skills" value="HTML">
                    HTML
                </label><br>
                <label for="skill-css">
                    <input type="checkbox" id="skill-css" name="skills" value="CSS">
                    CSS
                </label><br>
                <label for="skill-js">
                    <input type="checkbox" id="skill-js" name="skills" value="JavaScript">
                    JavaScript
                </label><br>

            </fieldset>

            </label><br><br>
            </fieldset>
            <fieldset>
                <legend>Experience Level</legend>
                <label for="level-beginner">
                    <input type="radio" id="level-beginner" name="level" value="beginner" required>
                    Beginner
                </label><br>
                <label for="level-intermediate">
                    <input type="radio" id="level-intermediate" name="level" value="intermediate" required>
                    Intermediate
                </label><br>
                <label for="level-advanced">
                    <input type="radio" id="level-advanced" name="level" value="advanced" required>
                    Advanced

                </label><br>
            </fieldset><br>
            <button type="submit">Create Account</button>
            <button type="reset">Clear Form</button>
            </fieldset>




        </form>
    </main>

</body>

</html>
